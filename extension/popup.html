<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0e14;
      --s1:       #12151f;
      --s2:       #181c29;
      --border:   #1e2333;
      --border-2: #252a3a;
      --accent:   #3b82f6;
      --accent-d: #1d4ed8;
      --green:    #10b981;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --t1:       #e8eaf0;
      --t2:       #6b7280;
      --t3:       #374151;
      --font:     'Inter', system-ui, sans-serif;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--t1);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Layout ── */
    .shell {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
    }

    .section {
      background: var(--bg);
      padding: 12px 14px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--t1);
    }

    .tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--t3);
      letter-spacing: 0.04em;
      background: var(--s2);
      border: 1px solid var(--border-2);
      border-radius: 4px;
      padding: 1px 6px;
    }

    /* ── Status row ── */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--t3);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.online  { background: var(--green); animation: breathe 3s ease-in-out infinite; }
    .dot.offline { background: var(--red); }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    .status-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--t1);
    }

    .status-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      color: var(--t2);
    }

    .meta-item .label {
      color: var(--t3);
      font-weight: 400;
    }

    /* ── Tab section ── */
    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .favicon-box {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--s2);
      border: 1px solid var(--border-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .favicon-box img { width: 14px; height: 14px; object-fit: contain; }
    .favicon-box .placeholder {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--border-2);
    }

    .tab-info { flex: 1; min-width: 0; }
    .tab-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--t1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-host {
      font-size: 10px;
      color: var(--t3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* ── Section label ── */
    .sec-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--t3);
      margin-bottom: 8px;
    }

    /* ── Automation panel ── */
    #automPanel { display: none; }
    #automPanel.visible { display: block; }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--t1);
      font-variant-numeric: tabular-nums;
    }

    .right-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .state-pill {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 1px 7px;
      border-radius: 3px;
      border: 1px solid transparent;
    }
    .state-pill.running {
      color: var(--accent);
      border-color: rgba(59,130,246,0.3);
      background: rgba(59,130,246,0.08);
    }
    .state-pill.paused {
      color: var(--amber);
      border-color: rgba(245,158,11,0.3);
      background: rgba(245,158,11,0.08);
    }

    .elapsed {
      font-size: 10px;
      font-weight: 500;
      color: var(--t2);
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 2px;
      background: var(--border-2);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.5s ease;
    }

    .action-line {
      font-size: 11px;
      color: var(--t2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .stat {
      background: var(--s1);
      padding: 8px 10px;
      text-align: center;
    }

    .stat-n {
      font-size: 16px;
      font-weight: 700;
      color: var(--t1);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 3px;
    }

    .stat-k {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--t3);
    }

    /* ── Controls ── */
    .controls {
      display: none;
      gap: 6px;
    }
    .controls.visible { display: flex; }

    .ctrl {
      flex: 1;
      padding: 6px 0;
      border-radius: 5px;
      border: 1px solid var(--border-2);
      background: var(--s1);
      color: var(--t2);
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .ctrl:hover { background: var(--s2); color: var(--t1); border-color: var(--border-2); }
    .ctrl:active { transform: scale(0.97); }
    .ctrl:disabled { opacity: 0.3; cursor: default; transform: none; }
    .ctrl.danger:hover  { border-color: rgba(239,68,68,0.4); color: var(--red); }
    .ctrl.primary:hover { border-color: rgba(59,130,246,0.4); color: var(--accent); }

    /* ── Log feed ── */
    #logSection { display: none; }
    #logSection.visible { display: block; }

    .log-list {
      max-height: 96px;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .log-list::-webkit-scrollbar { display: none; }

    .log-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.15s ease-out;
    }
    .log-row:last-child { border-bottom: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .log-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      width: 26px;
      text-align: right;
    }
    .log-badge.ok   { color: var(--green); }
    .log-badge.err  { color: var(--red); }
    .log-badge.info { color: var(--accent); }
    .log-badge.warn { color: var(--amber); }

    .log-text {
      font-size: 10px;
      color: var(--t2);
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .log-ts {
      font-size: 9px;
      color: var(--t3);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Idle ── */
    #idleRow {
      font-size: 11px;
      color: var(--t3);
      text-align: center;
      padding: 4px 0 2px;
      display: none;
    }
    #idleRow.visible { display: block; }

    /* ── Reconnect ── */
    .btn-reconnect {
      width: 100%;
      padding: 8px;
      background: var(--s1);
      border: 1px solid var(--border-2);
      border-radius: 5px;
      color: var(--t2);
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      letter-spacing: 0.02em;
    }
    .btn-reconnect:hover { background: var(--s2); color: var(--t1); }
    .btn-reconnect:active { transform: scale(0.98); }

    /* ── Footer ── */
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--t3);
    }
    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--t3);
    }
    .footer-dot.online { background: var(--green); }
    .log-counter {
      font-size: 10px;
      color: var(--t3);
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <div class="section header">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="icon48.png" alt="Nexus" style="width:20px;height:20px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(56,189,248,0.55));" />
      <span class="wordmark" style="letter-spacing:0.1em;background:linear-gradient(135deg,#e0f2fe 0%,#c084fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">NEXUS</span>
    </div>
    <span class="tag">v2.0</span>
  </div>

  <!-- Status -->
  <div class="section status-row">
    <div class="status-left">
      <div class="dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">Checking</span>
    </div>
    <div class="status-meta" id="statusMeta" style="display:none">
      <div class="meta-item">
        <span class="label">ping</span>
        <span id="pingVal">—</span>
      </div>
      <div class="meta-item">
        <span id="syncVal">—</span>
      </div>
    </div>
  </div>

  <!-- Active tab -->
  <div class="section">
    <div class="sec-label">Active tab</div>
    <div class="tab-row">
      <div class="favicon-box" id="faviconBox">
        <div class="placeholder"></div>
      </div>
      <div class="tab-info">
        <div class="tab-name" id="tabName">Loading</div>
        <div class="tab-host" id="tabHost"></div>
      </div>
    </div>
  </div>

  <!-- Automation panel -->
  <div class="section" id="automPanel">
    <div class="sec-label">Automation</div>

    <div class="progress-header">
      <span class="step-label">Step <span id="stepCur">0</span> / <span id="stepTot">—</span></span>
      <div class="right-meta">
        <span class="elapsed" id="elapsed">00:00</span>
        <span class="state-pill running" id="statePill">Running</span>
      </div>
    </div>

    <div class="track">
      <div class="fill" id="progressFill" style="width:0%"></div>
    </div>

    <div class="action-line" id="actionLine">Initialising</div>
  </div>

  <!-- Stats -->
  <div class="section" id="statsSection" style="display:none; padding: 0;">
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-n" id="sSteps">0</div>
        <div class="stat-k">Steps</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="sValid">—</div>
        <div class="stat-k">Validated</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="sRetry">0</div>
        <div class="stat-k">Retries</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="section controls" id="controls">
    <button class="ctrl primary" id="btnResume">Resume</button>
    <button class="ctrl"         id="btnPause">Pause</button>
    <button class="ctrl danger"  id="btnStop">Stop</button>
  </div>

  <!-- Idle -->
  <div class="section" id="idleRow" style="display:none; padding: 10px 14px;">
    <div style="font-size:11px; color:var(--t3); text-align:center;">No automation running</div>
  </div>

  <!-- Log feed -->
  <div class="section" id="logSection" style="display:none;">
    <div class="sec-label" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span>Log</span>
      <span class="log-counter" id="logCounter">0</span>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- Reconnect -->
  <div class="section">
    <button class="btn-reconnect" id="reconnectBtn">Reconnect</button>
  </div>

  <!-- Footer -->
  <div class="section footer-row" style="padding: 8px 14px;">
    <div class="footer-status">
      <div class="footer-dot" id="footerDot"></div>
      <span id="footerText">NEXUS</span>
    </div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>

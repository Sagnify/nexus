name: NEXUS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Frontend Pipeline: TypeScript Check & Vite Production Build
  # =========================================================================
  frontend:
    name: Frontend (TypeScript & Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build Web & Electron Bundles
        run: npm run build:ci

  # =========================================================================
  # Backend Pipeline: Python 3.12, Alembic Check & Unit Tests
  # =========================================================================
  backend:
    name: Backend (Python 3.12 & Test Suites)
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      NEXUS_TEST_MODE: "1"
      GROQ_API_KEY: "test_groq_key"
      FIREBASE_PROJECT_ID: "nexus-9290d"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Migrations
        run: |
          python -m alembic heads

      - name: Run Backend Unit Tests
        run: |
          python -m unittest tests/test_firebase_auth.py tests/test_db_isolation.py tests/test_recommendation_repo.py tests/test_docx_automation.py tests/test_media_player.py
